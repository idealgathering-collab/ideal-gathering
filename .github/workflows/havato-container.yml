name: Havato container verification
on:
  push:
    branches: [havato]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Focused notification checks with the frozen dependency graph
        run: |
          bun install --frozen-lockfile
          bun run test -- tests/unit/push-delivery.test.ts tests/unit/push-adapter.test.ts tests/unit/web-push.test.ts tests/unit/push-events.test.ts tests/unit/notification-preferences.test.ts tests/unit/notification-preferences-store.test.ts
          npm install --prefix /tmp/havato-pg --no-save --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.8 jsdom@26.1.0
          node tests/push-events.local.mjs /tmp/havato-pg/node_modules/@electric-sql/pglite/dist/index.js
          node tests/notification-preferences.local.mjs /tmp/havato-pg/node_modules/@electric-sql/pglite/dist/index.js
          HAVATO_TEST_JSDOM=/tmp/havato-pg/node_modules/jsdom/lib/api.js bun run test -- tests/unit/notification-controls.ui.test.ts
          node --test tests/pwa-push.test.mjs tests/pwa-service-worker.test.mjs tests/pwa-install.test.mjs
          bunx tsc --noEmit
          bunx eslint src/lib/push-delivery.server.ts src/lib/push-events.server.ts src/lib/notification-preferences.ts src/lib/notification-preferences-store.ts src/components/notification-preferences-controls.tsx src/components/push-notification-entry.tsx tests/unit/push-events.test.ts tests/unit/push-delivery.test.ts tests/unit/push-adapter.test.ts tests/unit/notification-preferences.test.ts tests/unit/notification-preferences-store.test.ts
      - name: Build container with dummy backend only
        run: >-
          docker build -t havato:test
          --build-arg VITE_SUPABASE_URL=http://127.0.0.1:54321
          --build-arg VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ig009_local_fixture
          --build-arg VITE_SITE_URL=http://localhost:3000 .
      - name: Verify stateless container startup and port 3000
        run: |
          set -x
          docker run -d --name havato-test --read-only --tmpfs /tmp -p 3000:3000 -e SUPABASE_URL=http://127.0.0.1:54321 -e SUPABASE_PUBLISHABLE_KEY=sb_publishable_ig009_local_fixture -e SUPABASE_SERVICE_ROLE_KEY=ig009_server_only_sentinel havato:test
          for attempt in $(seq 1 60); do
            if curl --fail --silent --location http://localhost:3000/auth > /tmp/havato.html; then break; fi
            sleep 2
          done
          node -e "const s=require('fs').readFileSync('/tmp/havato.html','utf8');console.log('SSR bytes',s.length,'Havato',s.includes('Havato'));if(!s.includes('Havato')){console.log(s.slice(0,2000));process.exit(1)}"
          curl --fail --silent http://localhost:3000/manifest.webmanifest -o /tmp/manifest.json
          cat /tmp/manifest.json
          grep -q Havato /tmp/manifest.json
          docker exec havato-test node -e "const fs=require('fs');for(const p of fs.readdirSync('.output/public/assets')){if(/\\.js$/.test(p)&&fs.readFileSync('.output/public/assets/'+p,'utf8').includes('ig009_server_only_sentinel'))process.exit(1)}"
          test "$(docker inspect --format '{{.Config.User}}' havato-test)" = node
      - name: Container logs
        if: always()
        run: docker logs havato-test || true
