name: IG-009 one-time asset import
on:
  push:
    branches: [codex/ig-009-staging-beta]
    paths: [.github/workflows/ig009-import-assets.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ig-009-staging-beta
      - name: Copy existing public images with fixed checksums
        run: |
          set -eu
          mkdir -p public/assets
          curl --fail --location --retry 3 --max-time 120 'https://www.idealgathering.com/__l5e/assets-v1/95e9139d-6f50-4e47-be81-b562398fdf49/our-story-empty-chair.png' -o public/assets/our-story-empty-chair.png
          curl --fail --location --retry 3 --max-time 120 'https://www.idealgathering.com/__l5e/assets-v1/844de723-c797-4c87-98e1-88579c5b68e5/our-story-friends-at-cafe.png' -o public/assets/our-story-friends-at-cafe.png
          echo '5365d952a1eee197452f8eeef346c6dcf84ec82679c54b1f1c098f90b4573150  public/assets/our-story-empty-chair.png' | sha256sum --check
          echo 'dfaebcc5890e63efe4a7409d1d71e4e30421b302a621ae2fa64aed6d2fb9cc8d  public/assets/our-story-friends-at-cafe.png' | sha256sum --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/assets/our-story-empty-chair.png public/assets/our-story-friends-at-cafe.png
          if ! git diff --cached --quiet; then
            git commit -m 'Vendor existing story images for independent hosting'
            git push origin HEAD:codex/ig-009-staging-beta
          fi
